<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <!-- 흰 큰 카드 -->
    <section class="sheet">
      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="section-label">ABOUT ME</p>
        <div class="photo" id="photo"></div>
        <h2 class="about-name" id="name">불러오는 중…</h2>
        <p class="about-title" id="title"></p>
        <p class="badge" id="career-badge" hidden></p>

        <ul class="info">
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span id="info-name"></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span id="info-email"></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24"><path d="M6 3h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span id="info-phone"></span>
          </li>
          <li>
            <span class="info-icon">
              <svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-13a7 7 0 0 0-14 0c0 5.8 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <span id="info-location"></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h1 class="big-title">PORTFOLIO</h1>
        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
              </span>
              EDUCATION
            </h3>
            <p class="fact-text" id="education"></p>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
              </span>
              SKILLS &amp; TOOLS
            </h3>
            <div class="chips" id="skills"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </span>
              EXPERIENCE
            </h3>
            <p class="fact-text" id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="empty">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="quote"></blockquote>
      </div>
    </section>

    <!-- 방명록 상자 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="intro">편하게 한마디 남겨 주세요.</p>

      <div class="gb-form">
        <input id="gb-nickname" type="text" maxlength="20" placeholder="별명 (20자까지)">
        <input id="gb-message" type="text" maxlength="200" placeholder="한마디 (200자까지)">
        <button type="button" id="gb-submit" class="btn">남기기</button>
      </div>
      <p class="gb-status" id="gb-status"></p>

      <ul class="gb-list" id="gb-list">
        <li class="empty">불러오는 중…</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
